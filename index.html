<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMBOTRP GENERATOR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif, system-ui;
        }

        body {
            background-color: #0b0914;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #120e24;
            border: 1px solid #231b42;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(90deg, #9b51e0, #70a1ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #7b7593;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #8c85a6;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #090712;
            border: 1px solid #261f47;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #7a52f4;
        }

        .delete-group {
            display: flex;
            gap: 8px;
        }

        .btn-delete {
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #8a44ff, #4a75ff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-reset {
            width: 100%;
            padding: 12px;
            border: none;
            background: transparent;
            color: #5d567a;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
        }

        .result-box {
            margin-top: 15px;
            background-color: #090712;
            border: 1px dashed #34285c;
            border-radius: 10px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            display: none;
            font-family: monospace;
            font-size: 12px;
            color: #2ed573;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="title">AIMBOTRP GENERATOR</div>
    <div class="subtitle">ระบบสร้าง License Key รูปแบบใหม่</div>

    <div class="form-group">
        <label>รูปแบบการสร้าง</label>
        <select id="format">
            <option value="standard">AIMBOTRP - รูปแบบมาตรฐาน (ตัวพิมพ์ใหญ่)</option>
        </select>
    </div>

    <div class="form-group">
        <label>ลบคีย์ออกจากระบบ</label>
        <div class="delete-group">
            <input type="text" placeholder="พิมพ์คีย์ที่ต้องการลบ...">
            <button class="btn-delete">ลบ</button>
        </div>
    </div>

    <div class="form-group">
        <label>จำนวนที่ต้องการสร้าง (เช่น 1-500)</label>
        <input type="number" id="keyCount" value="1" min="1" max="500">
    </div>

    <div class="row">
        <div class="form-group">
            <label>ประเภทเวลา</label>
            <select id="timeType" onchange="toggleTimeInput()">
                <option value="hours">ชั่วโมง (Hours)</option>
                <option value="days" selected>วัน (Days)</option>
                <option value="lifetime">ถาวร (Lifetime)</option>
            </select>
        </div>
        <div class="form-group" id="timeValueGroup">
            <label>จำนวนเวลา</label>
            <input type="number" id="timeValue" value="1" min="1">
        </div>
    </div>

    <button class="btn-generate" onclick="generateKeys()">✨ สร้างคีย์ (Generate)</button>
    <button class="btn-reset" onclick="resetForm()">รีเซ็ตค่า</button>

    <div class="result-box" id="resultBox"></div>
</div>

<script>
    function toggleTimeInput() {
        const timeType = document.getElementById('timeType').value;
        const timeValueGroup = document.getElementById('timeValueGroup');
        timeValueGroup.style.display = (timeType === 'lifetime') ? 'none' : 'block';
    }

    function generateKeys() {
        const count = parseInt(document.getElementById('keyCount').value) || 1;
        const timeType = document.getElementById('timeType').value;
        const timeValue = document.getElementById('timeValue').value;
        const resultBox = document.getElementById('resultBox');

        let keys = [];
        let durationText = timeType === 'lifetime' ? 'LIFETIME' : `${timeValue}-${timeType.toUpperCase()}`;

        for (let i = 0; i < count; i++) {
            const randomCode = Math.random().toString(36).substring(2, 10).toUpperCase();
            keys.push(`AIMBOTRP-${durationText}-${randomCode}`);
        }

        resultBox.style.display = 'block';
        resultBox.innerHTML = keys.join('<br>');
    }

    function resetForm() {
        document.getElementById('keyCount').value = 1;
        document.getElementById('timeType').value = 'days';
        document.getElementById('timeValue').value = 1;
        toggleTimeInput();
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'none';
        resultBox.innerHTML = '';
    }
</script>

</body>
</html>
